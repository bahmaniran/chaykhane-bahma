name: Build Android APK (Chaikhaneh)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project Zip If Exists
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found zip file in repository, extracting..."
            unzip -o -q "*.zip" || true
          fi

      - name: Install Dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm install --save --legacy-peer-deps @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npm run build

      - name: Configure Capacitor & Add Android Platform
        run: |
          cat << 'CONFEOF' > capacitor.config.json
          {
            "appId": "com.bahmaniran.chaikhaneh",
            "appName": "چایخانه عمو بهمن",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": false
            }
          }
          CONFEOF
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set App Name & Persian Strings
        run: |
          cat << 'STREOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">چای خانه</string>
              <string name="title_activity_main">چای خانه</string>
              <string name="package_name">com.bahmaniran.chaikhaneh</string>
          </resources>
          STREOF

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias chaikhaneh \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -storepass bahman123456 \
            -keypass bahman123456 \
            -dname "CN=Bahman Bamzad, O=Bahman Studio, C=IR"

          python3 - << 'PYEOF'
          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'bahman123456'
                      keyAlias 'chaikhaneh'
                      keyPassword 'bahman123456'
                  }
              }
          """
          content = content.replace('buildTypes {', signing_block + '\n    buildTypes {')
          content = content.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release')
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaikhaneh-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
